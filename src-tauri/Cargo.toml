[package]
name = "roster-desk"
version = "0.1.0"
description = "Keyboard-first terminal for the hosts in a roster Inventory"
edition = "2024"

[lib]
name = "roster_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
desk-core = { path = "../crates/desk-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
