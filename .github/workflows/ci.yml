# roster CI: both halves of the repo on every pull request and on pushes to main/dev and tags.
#   CLI  (repo root): ruff, pytest on every supported Python, build the wheel.
#        Tests need no network, SSH server or password manager (stand-in bw/op/pass/ssh in tests/fakes).
#   App  (app/, crates/roster-core, app/src-tauri): tsc + ESLint + Vitest; rustfmt, clippy and
#        cargo test on Linux (with the WebKitGTK/D-Bus dev packages, so clippy covers the Tauri
#        crate too); release builds of the Windows and Linux apps.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"
  UV_PYTHON_DOWNLOADS: "never"   # use the Python setup-python installed, never fetch another
  CARGO_TERM_COLOR: always

jobs:
  cli-lint:
    name: CLI lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --python python3.12
      - run: uv run --python python3.12 ruff check src tests
      # One version across pyproject.toml, package.json, tauri.conf.json, the Cargo.tomls and the lock files.
      - run: scripts/bump-version.sh --check

  cli-test:
    name: CLI tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]   # requires-python >= 3.10
    env:
      UV_PYTHON: ${{ matrix.python }}      # overrides .python-version for every uv command
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run pytest --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-${{ matrix.python }}
          path: report.xml
          retention-days: 7

  cli-build:
    name: CLI build (wheel + sdist)
    runs-on: ubuntu-latest
    needs: [cli-lint, cli-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv build --python python3.12
      - run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 28

  app-frontend:
    name: App frontend (tsc, ESLint, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  app-rust:
    name: App Rust (fmt, clippy, cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # What Tauri needs to build on Linux (app/src-tauri): WebKitGTK 4.1, GTK, D-Bus, appindicator, rsvg.
      - name: Install the Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The Tauri crate embeds the built frontend (app/dist) at compile time; clippy only needs it to exist.
      - name: Stub the frontend build for clippy
        run: mkdir -p app/dist && echo '<!doctype html><title>Roster</title>' > app/dist/index.html
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Default member roster-core: the PTY, JSON-RPC (tests/fake_serve.py) and Lua Config tests.
      - run: cargo test

  app-windows:
    name: App Windows release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - run: npm run tauri build -- --no-bundle
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: roster-app-windows
          path: target/release/roster-app.exe
          retention-days: 14

  # The Linux app (WebKitGTK 4.1), so a Linux break shows up before a release, and a binary to try under
  # WSLg or on a Linux VM: app/scripts/linux-run.sh fetch (docs/app/dev/linux.md). Ubuntu 22.04, as the
  # release build: its glibc runs on newer distros.
  app-linux:
    name: App Linux release build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config build-essential
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - run: npm run tauri build -- --no-bundle
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: roster-app-linux
          path: target/release/roster-app
          retention-days: 14
