<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <!-- roster-desk logo D1 "Network R" (decision Q29): seven nodes joined into an R; the accent node (jade #1f9d68) ends the leg. App icon master: `npm run icons` (scripts/icons.mjs) renders src-tauri/icons from it. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#13161b"/>
  <g stroke="#e3e7ec" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="20" y1="14" x2="20" y2="32"/>
    <line x1="20" y1="32" x2="20" y2="50"/>
    <line x1="20" y1="14" x2="38" y2="14"/>
    <line x1="38" y1="14" x2="45" y2="23"/>
    <line x1="45" y1="23" x2="38" y2="32"/>
    <line x1="38" y1="32" x2="20" y2="32"/>
    <line x1="38" y1="32" x2="46" y2="50"/>
  </g>
  <g fill="#e3e7ec">
    <circle cx="20" cy="14" r="4.2"/>
    <circle cx="20" cy="32" r="4.2"/>
    <circle cx="20" cy="50" r="4.2"/>
    <circle cx="38" cy="14" r="4.2"/>
    <circle cx="45" cy="23" r="4.2"/>
    <circle cx="38" cy="32" r="4.2"/>
  </g>
  <circle cx="46" cy="50" r="5.5" fill="#1f9d68"/>
</svg>
