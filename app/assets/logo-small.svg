<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <!-- logo D1 for 16-32 px: the same mark with heavier edges and nodes so it survives small sizes. -->
  <rect x="1" y="1" width="62" height="62" rx="12" fill="#13161b"/>
  <g stroke="#e3e7ec" stroke-width="4.4" stroke-linecap="round" opacity="0.62">
    <line x1="20" y1="14" x2="20" y2="32"/>
    <line x1="20" y1="32" x2="20" y2="50"/>
    <line x1="20" y1="14" x2="38" y2="14"/>
    <line x1="38" y1="14" x2="45" y2="23"/>
    <line x1="45" y1="23" x2="38" y2="32"/>
    <line x1="38" y1="32" x2="20" y2="32"/>
    <line x1="38" y1="32" x2="46" y2="50"/>
  </g>
  <g fill="#e3e7ec">
    <circle cx="20" cy="14" r="5.2"/>
    <circle cx="20" cy="32" r="5.2"/>
    <circle cx="20" cy="50" r="5.2"/>
    <circle cx="38" cy="14" r="5.2"/>
    <circle cx="45" cy="23" r="5.2"/>
    <circle cx="38" cy="32" r="5.2"/>
  </g>
  <circle cx="46" cy="50" r="6.6" fill="#1f9d68"/>
</svg>
