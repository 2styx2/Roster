<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="1024" height="1024" role="img" aria-label="roster">
  <!-- roster app icon, the small cut at 32 px (decision Q59, issue #78 / Q65): drawn on the 32 px grid itself (viewBox 0 0 N N, lines on pixel centres), so the network R keeps its nodes at taskbar size: the stem-top and bowl nodes, the Box square at the foot, the leg out to the one apricot Host ring in the orbit's gap. Mid-tone neutral #808183 and mid apricot #cc5c2b on a transparent background, as logo-icon.svg. Also rendered at 32 px. scripts/icons.mjs puts each cut in icon.ico at its own size. -->
  <path d="M20 29.94A14.5 14.5 0 1 1 29.94 20" fill="none" stroke="#808183" stroke-width="2" stroke-linecap="round"/>
  <path d="M9.5 7.5V20.5M9.5 7.5H16.5L22.5 12.5L16.5 17.5H9.5M16.5 17.5L20.9 20.9" fill="none" stroke="#808183" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#808183"><circle cx="9.5" cy="7.5" r="3.5"/><circle cx="22.5" cy="12.5" r="3.5"/></g>
  <rect x="6.5" y="20" width="6" height="6" rx="1.2" fill="#808183"/>
  <circle cx="24.5" cy="24.5" r="4" fill="none" stroke="#cc5c2b" stroke-width="2"/>
