[package]
name = "roster-core"
version = "0.1.0"
edition = "2024"
description = "roster-desk's Tauri-free core: backend detection, the roster serve JSON-RPC client, the session manager"

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Lua Config (config.rs): Lua 5.4 built in, so no system Lua is needed (ADR 0002).
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# Schema errors name the field that's wrong (`terminal.size`), for the file:line in the toast.
serde_path_to_error = "0.1"
# Live reload of init.lua: watch the config dir (editors save by rename).
notify = "8"

# Polling the PTY master so a Session's reader can stop (session.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
